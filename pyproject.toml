[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "selflensing"
version = "0.0.1"
authors = [
  { name="Adam McMaster", email="a.mcmaster@soton.ac.uk" },
]
description = "A Python self-lensing model, for generating and fitting photometry and RV."
readme = "README.md"
requires-python = ">=3.12,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies=[
    "astropy (>=7.1.0,<8.0.0)", 
    "numpy (>=2.3.0,<3.0.0)", 
    "gmpy2 (>=2.2.0,<3.0.0)",
    "scipy (>=1.16.0,<2.0.0)",
    "rustlens (>=0.4.0,<1.0.0)",
    "emcee (>=3.1.0,<4.0.0)",
    "tqdm (>=4.67.0,<5.0.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "jax (>=0.8.1,<1.0.0)",
    "tinygp (>=0.3.0,<0.4.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "unxt (>=1.7.7,<2.0.0)",
]

[project.urls]
Homepage = "https://github.com/COBALT-lensing/py-self-lensing"
Issues = "https://github.com/COBALT-lensing/py-self-lensing/issues"

[project.optional-dependencies]
cuda = ["jax[cuda13]>=0.8.1,<1.0.0"]
cuda13 = ["jax[cuda13]>=0.8.1,<1.0.0"]
cuda12 = ["jax[cuda12]>=0.8.1,<1.0.0"]
cuda13-local = ["jax[cuda13-local]>=0.8.1,<1.0.0"]
cuda12-local = ["jax[cuda12-local]>=0.8.1,<1.0.0"]
rocm = ["jax[rocm7-local]>=0.8.1,<1.0.0"]
demo = ["ipykernel (>=7.0.0,<8.0.0)", "matplotlib (>=3.10.5,<4.0.0)", "corner (>=2.2.3,<3.0.0)"]
